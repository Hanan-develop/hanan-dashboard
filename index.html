<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Hanan Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">AH</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your dashboard</p>
      <form id="loginForm">
        <div class="form-field"><label>Username</label><input type="text" id="username" required autocomplete="username" placeholder="hanan" /></div>
        <div class="form-field"><label>Password</label><input type="password" id="password" required autocomplete="current-password" /></div>
        <div id="errorMsg" style="display:none; padding: 0.9rem; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--error); color: var(--error); border-radius: 0.7rem; margin-bottom: 1rem; text-align: center; font-size: 1.15rem;"></div>
        <button type="submit" class="btn-save" style="width: 100%; justify-content: center; padding: 1.3rem;"><i class="fa-solid fa-right-to-bracket"></i> <span>Sign In</span></button>
      </form>
      <p style="text-align: center; margin-top: 1.4rem; color: var(--text-muted); font-size: 1.1rem;">Default: <strong>hanan</strong> / <strong>hanan@2026</strong></p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
