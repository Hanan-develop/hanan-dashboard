<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Admin Dashboard - Hanan Portfolio" />
  <meta name="theme-color" content="#f9ca24" />
  <title>Login — Hanan Dashboard</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>

  <!-- Background Effects -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- Theme Toggle (Top right) -->
  <button class="theme-toggle login-theme-toggle" id="themeToggle" title="Toggle theme (T)" aria-label="Toggle theme">
    <i class="fa-solid fa-moon moon-icon"></i>
    <i class="fa-solid fa-sun sun-icon"></i>
  </button>

  <!-- Login Container -->
  <div class="auth-wrap">
    <div class="auth-card">

      <!-- Logo / Brand -->
      <div class="auth-brand">
        <div class="brand-avatar">
          <span>AH</span>
        </div>
        <h1>Hanan Dashboard</h1>
        <p>Sign in to manage your portfolio</p>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="loginForm" autocomplete="off">

        <!-- Username Field -->
        <div class="form-field">
          <i class="fa-solid fa-user field-icon"></i>
          <input type="text" id="username" placeholder=" " required autocomplete="username" />
          <label for="username">Username</label>
        </div>

        <!-- Password Field -->
        <div class="form-field">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" id="password" placeholder=" " required autocomplete="current-password" />
          <label for="password">Password</label>
          <button type="button" class="toggle-pwd" id="togglePwd" aria-label="Show password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>

        <!-- Remember + Forgot -->
        <div class="form-row">
          <label class="checkbox-wrap">
            <input type="checkbox" id="rememberMe" />
            <span class="checkbox-box"><i class="fa-solid fa-check"></i></span>
            <span class="checkbox-label">Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Error message -->
        <div class="form-error" id="formError" role="alert"></div>

        <!-- Submit Button -->
        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <i class="fa-solid fa-arrow-right btn-icon"></i>
          <i class="fa-solid fa-spinner btn-spinner"></i>
        </button>
      </form>

      <!-- Footer -->
      <div class="auth-footer">
        <a href="https://hanan-develop.github.io/hanan-portfolio/" target="_blank" rel="noopener">
          <i class="fa-solid fa-arrow-left"></i> Back to Portfolio
        </a>
      </div>
    </div>
  </div>

  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <!-- Auth JS -->
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
