            { title: 'Frontend Developer Certified', description: 'Completed advanced training at Al Khawarizmi Institute of Computer Science.', year: '2025', category: 'certification', icon: 'fa-certificate', color: '#22c55e', orderNum: 3 },

            { title: '5-Brand Portfolio', description: 'Successfully delivered projects for 5+ brands and clients.', year: '2025', category: 'milestone', icon: 'fa-medal', color: '#f9ca24', orderNum: 5, tag: 'major' },

        ]
    };

    var ACTIONS = {
        projects: 'saveProject',
        skills: 'saveSkill',
        testimonials: 'saveTestimonial',
        whatsnew: 'saveWhatsNew',
        services: 'saveService',
        achievements: 'saveAchievement'
    };

    function saveItem(action, data) {
        return new Promise(function (resolve) {
            var fd = new FormData();
            fd.append('action', action);
            fd.append('secret', HananAuth.getSecret());
            Object.keys(data).forEach(function (k) {
                if (data[k] !== null && data[k] !== undefined) fd.append(k, data[k]);
            });
            fetch(HananAuth.getApiUrl(), { method: 'POST', body: fd })
                .then(function (r) { return r.json(); })
                .then(function (res) { resolve(res && res.ok); })
                .catch(function () { resolve(false); });
        });
    }

    function migrateSection(section) {
        $('#status').html('<i class="fa-solid fa-spinner fa-spin"></i> Migrating ' + section + '...');
        if (section === 'settings') {
            return saveItem('saveSiteSettings', DATA.settings);
        }
        var items = DATA[section];
        if (!items || !items.length) return Promise.resolve(false);
        var action = ACTIONS[section];
        var promise = Promise.resolve();
        items.forEach(function (item, i) {
            promise = promise.then(function () {
                $('#status').html('<i class="fa-solid fa-spinner fa-spin"></i> ' + section + ' ' + (i + 1) + '/' + items.length);
                return saveItem(action, item);
            }).then(function () { return new Promise(function (r) { setTimeout(r, 400); }); });
        });
        return promise;
    }

    $('#megaBtn').on('click', function () {
        if (!confirm('Migrate ALL portfolio data? This will add ~34 items to Google Sheet.')) return;
        var $btn = $(this);
        $btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> Migrating...');
        Promise.resolve()
            .then(function () { return migrateSection('settings'); })
            .then(function () { return migrateSection('projects'); })
            .then(function () { return migrateSection('skills'); })
            .then(function () { return migrateSection('testimonials'); })
            .then(function () { return migrateSection('whatsnew'); })
            .then(function () { return migrateSection('services'); })
            .then(function () { return migrateSection('achievements'); })
            .then(function () {
                try { localStorage.removeItem('hanan_dashboard_cache'); } catch (e) {}
                $btn.html('<i class="fa-solid fa-check"></i> All Done!');
                $('#status').html('<i class="fa-solid fa-circle-check" style="color:var(--success);"></i> Migration complete! 🎉');
                notify({ message: 'Migration complete!', type: 'success' });
                setTimeout(function () { window.location.href = 'dashboard.html'; }, 2000);
            });
    });

    $('[data-section]').on('click', function () {
        var section = $(this).data('section');
        var $btn = $(this);
        $btn.prop('disabled', true);
        migrateSection(section).then(function () {
            try { localStorage.removeItem('hanan_dashboard_cache'); } catch (e) {}
            $btn.html('<i class="fa-solid fa-check"></i> Done!');
            $('#status').html('<i class="fa-solid fa-circle-check" style="color:var(--success);"></i> ' + section + ' migrated!');
            notify({ message: section + ' done!', type: 'success' });
        });
    });
})();
