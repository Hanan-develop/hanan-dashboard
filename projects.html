<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Hanan Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/features.css" />
  <link rel="stylesheet" href="css/projects.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
  </div>
  <div class="bg-grid" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-avatar"><span>AH</span></div>
      <div><h3 id="sbUserName">Hanan</h3><p>Admin Panel</p></div>
    </div>
    <nav class="sb-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> <span>Dashboard</span></a>
      <a href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span></a>
      <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> <span>Analytics</span></a>
      <a href="projects.html" class="active"><i class="fa-solid fa-folder-open"></i> <span>Projects</span></a>
      <a href="testimonials.html"><i class="fa-solid fa-star"></i> <span>Testimonials</span></a>
      <a href="settings.html"><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
    </nav>
    <div class="sb-footer">
      <button class="sb-logout" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="sb-toggle" id="sbToggle"><i class="fa-solid fa-bars"></i></button>
      <h1>Projects</h1>
      <div class="topbar-actions">
        <button class="btn-refresh" id="cmdPaletteBtn" title="Search (Ctrl+K)" style="margin-right: 0.4rem;">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme (T)">
          <i class="fa-solid fa-moon moon-icon"></i>
          <i class="fa-solid fa-sun sun-icon"></i>
        </button>
        <button class="btn-refresh" id="refreshBtn"><i class="fa-solid fa-arrows-rotate"></i></button>
        <button class="btn-view-site" id="addNewBtn">
          <i class="fa-solid fa-plus"></i> <span>Add Project</span>
        </button>
      </div>
    </header>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card stat-yellow">
        <div class="stat-icon"><i class="fa-solid fa-folder-open"></i></div>
        <div class="stat-content">
          <span class="stat-label">Total Projects</span>
          <span class="stat-value" id="totalCount">0</span>
          <span class="stat-trend"><i class="fa-solid fa-database"></i><span>All categories</span></span>
        </div>
      </div>
      <div class="stat-card stat-blue">
        <div class="stat-icon"><i class="fa-solid fa-tag"></i></div>
        <div class="stat-content">
          <span class="stat-label">Categories</span>
          <span class="stat-value" id="categoryCount">0</span>
          <span class="stat-trend"><i class="fa-solid fa-layer-group"></i><span>Unique types</span></span>
        </div>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search projects..." />
      </div>
      <div class="filter-buttons" id="categoryFilters">
        <button class="fb active" data-filter="all">All</button>
      </div>
    </div>

    <!-- Projects Grid -->
    <div class="projects-grid" id="projectsGrid">
      <div class="loading-state">
        <div class="loader-spinner"></div>
        <p>Loading projects from Google Sheets...</p>
      </div>
    </div>

  </main>

  <!-- Add/Edit Project Modal -->
  <div class="modal" id="projectModal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card project-modal-card">
      <button class="modal-close" data-close><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-body">
        <h2 class="modal-title" id="modalTitle">Add New Project</h2>

        <form id="projectForm" class="project-form">
          <input type="hidden" id="projectId" />

          <div class="form-row-2">
            <div class="form-field">
              <i class="fa-solid fa-heading field-icon"></i>
              <input type="text" id="projTitle" placeholder=" " required maxlength="100" />
              <label for="projTitle">Project Title *</label>
            </div>

            <div class="form-field">
              <i class="fa-solid fa-tag field-icon"></i>
              <input type="text" id="projCategory" placeholder=" " required maxlength="50" list="categories" />
              <label for="projCategory">Category *</label>
              <datalist id="categories">
                <option value="WordPress">
                <option value="Shopify">
                <option value="Web Design">
                <option value="E-Commerce">
                <option value="Landing Page">
              </datalist>
            </div>
          </div>

          <div class="form-field full">
            <i class="fa-solid fa-align-left field-icon" style="top: 2rem;"></i>
            <textarea id="projDescription" placeholder=" " rows="3" maxlength="500"></textarea>
            <label for="projDescription">Description</label>
          </div>

          <div class="form-row-2">
            <div class="form-field">
              <i class="fa-solid fa-image field-icon"></i>
              <input type="url" id="projImage" placeholder=" " />
              <label for="projImage">Image URL</label>
            </div>

            <div class="form-field">
              <i class="fa-solid fa-link field-icon"></i>
              <input type="url" id="projLiveUrl" placeholder=" " />
              <label for="projLiveUrl">Live URL</label>
            </div>
          </div>

          <div class="form-row-2">
            <div class="form-field">
              <i class="fa-solid fa-code field-icon"></i>
              <input type="text" id="projTech" placeholder=" " maxlength="100" />
              <label for="projTech">Tech Used (e.g., HTML, CSS, JS)</label>
            </div>

            <div class="form-field color-field">
              <i class="fa-solid fa-palette field-icon"></i>
              <input type="text" id="projColor" placeholder=" " value="#f9ca24" maxlength="7" />
              <label for="projColor">Brand Color (hex)</label>
              <input type="color" id="projColorPicker" value="#f9ca24" class="color-picker-input" />
            </div>
          </div>

          <div class="form-error" id="formError"></div>

          <div class="form-actions">
            <button type="button" class="btn-cancel" data-close>Cancel</button>
            <button type="submit" class="btn-save" id="saveBtn">
              <i class="fa-solid fa-check"></i> <span>Save Project</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/features.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>
