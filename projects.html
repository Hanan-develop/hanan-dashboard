<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Hanan Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="bg-grid"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-avatar"><span>AH</span></div>
      <div><h3 id="sbUserName">Hanan</h3><p>Admin Panel</p></div>
    </div>
    <nav class="sb-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> <span>Dashboard</span></a>
      <a href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span> <span class="sb-badge" id="unreadBadge" style="display:none;">0</span></a>
      <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> <span>Analytics</span></a>
      <a href="projects.html" class="active"><i class="fa-solid fa-folder-open"></i> <span>Projects</span></a>
      <a href="testimonials.html"><i class="fa-solid fa-star"></i> <span>Testimonials</span></a>
      <a href="skills.html"><i class="fa-solid fa-code"></i> <span>Skills</span></a>
      <a href="services.html"><i class="fa-solid fa-briefcase"></i> <span>Services</span></a>
      <a href="achievements.html"><i class="fa-solid fa-trophy"></i> <span>Achievements</span></a>
      <a href="whatsnew.html"><i class="fa-solid fa-bullhorn"></i> <span>What's New</span></a>
      <a href="website-editor.html"><i class="fa-solid fa-pen-to-square"></i> <span>Website Editor</span></a>
      <a href="sections.html"><i class="fa-solid fa-eye"></i> <span>Sections</span></a>
      <a href="settings.html"><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
    </nav>
    <div class="sb-footer">
      <button class="sb-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="sb-toggle" id="sbToggle"><i class="fa-solid fa-bars"></i></button>
      <h1>Projects</h1>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle"><i class="fa-solid fa-moon moon-icon"></i><i class="fa-solid fa-sun sun-icon"></i></button>
        <div class="export-wrapper">
          <button class="btn-export" id="exportBtn"><i class="fa-solid fa-download"></i> <span>Export</span> <i class="fa-solid fa-chevron-down" style="font-size:0.85rem;margin-left:0.3rem;"></i></button>
          <div class="export-menu" id="exportMenu">
            <button id="exportPdfBtn"><i class="fa-solid fa-file-pdf menu-icon-pdf"></i> Export as PDF</button>
            <button id="exportDocBtn"><i class="fa-solid fa-file-word menu-icon-doc"></i> Export as Word</button>
          </div>
        </div>
        <button class="btn-bulk" id="bulkModeBtn" title="Bulk select mode"><i class="fa-solid fa-check-double"></i> <span>Bulk</span></button>
        <button class="btn-refresh" id="refreshBtn"><i class="fa-solid fa-arrows-rotate"></i></button>
        <button class="btn-add" id="addBtn"><i class="fa-solid fa-plus"></i> <span>Add Project</span></button>
      </div>
    </header>

    <div class="bulk-action-bar" id="bulkActionBar">
      <div class="info"><i class="fa-solid fa-check-double"></i> <strong id="bulkSelectedCount">0</strong> selected — click cards to select</div>
      <button class="btn-bulk-select" id="bulkSelectAll"><i class="fa-solid fa-list-check"></i> Select All</button>
      <button class="btn-bulk-delete" id="bulkDeleteBtn" disabled><i class="fa-solid fa-trash"></i> Delete Selected</button>
      <button class="btn-bulk-cancel" id="bulkCancelBtn"><i class="fa-solid fa-xmark"></i> Cancel</button>
    </div>

    <div class="page-stats">
      <div class="page-stat-card"><div class="icon yellow"><i class="fa-solid fa-folder-open"></i></div><div class="info"><div class="num" id="statTotal">0</div><div class="lbl">Total Projects</div></div></div>
      <div class="page-stat-card"><div class="icon blue"><i class="fa-solid fa-tags"></i></div><div class="info"><div class="num" id="statCategories">0</div><div class="lbl">Categories</div></div></div>
      <div class="page-stat-card"><div class="icon green"><i class="fa-solid fa-globe"></i></div><div class="info"><div class="num" id="statLive">0</div><div class="lbl">Live Sites</div></div></div>
    </div>

    <div class="filter-toolbar">
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
      </div>
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="searchInput" placeholder="Search projects..." />
      </div>
      <span class="search-result-count" id="searchResultCount" style="display:none;"></span>
    </div>

    <div class="card-grid" id="grid"><div class="loading-state"><div class="loader-spinner"></div><p>Loading...</p></div></div>
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-header"><h2 id="modalTitle">Add Project</h2><button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button></div>
      <form id="itemForm">
        <input type="hidden" id="itemId" />
        <div class="form-field"><label>Title *</label><input type="text" id="title" required maxlength="200" /></div>
        <div class="form-row">
          <div class="form-field"><label>Category</label><input type="text" id="category" maxlength="50" placeholder="E-Commerce, Travel..." /></div>
          <div class="form-field"><label>Color</label><div class="color-picker-wrap"><input type="color" id="color" value="#f9ca24" /><input type="text" id="colorHex" value="#f9ca24" maxlength="7" /></div></div>
        </div>
        <div class="form-field"><label>Description</label><textarea id="description" maxlength="1000"></textarea></div>        <div class="form-field">
          <label>Project Image</label>
          <div class="image-upload-wrap">
            <div class="image-upload-row">
              <input type="file" class="image-upload-input" id="imageFile_imageUrl" data-target="imageUrl" accept="image/*" />
              <button type="button" class="image-upload-btn" onclick="document.getElementById('imageFile_imageUrl').click()"><i class="fa-solid fa-upload"></i> Upload Image</button>
            </div>
            <img class="image-preview" alt="Preview" />
            <div class="image-or-divider">OR enter URL</div>
            <input type="url" id="imageUrl" placeholder="https://..." />
          </div>
        </div>
        <div class="form-field"><label>Live URL</label><input type="url" id="liveUrl" /></div>
        <div class="form-field"><label>Tech Stack (comma separated)</label><input type="text" id="tech" maxlength="200" /></div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-save"><i class="fa-solid fa-check"></i> <span id="saveBtnText">Save</span></button>
        </div>
      </form>
    </div>
  </div>
  </main>

  <div class="notify-container" id="notifyContainer"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>
