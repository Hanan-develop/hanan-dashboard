<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testimonials — Hanan Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/features.css" />
  <link rel="stylesheet" href="css/upgrade-patch.css" />
  <link rel="stylesheet" href="css/mobile-responsive.css" />
  <link rel="stylesheet" href="css/projects.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="bg-grid" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-avatar"><span>AH</span></div>
      <div>
        <h3 id="sbUserName">Hanan</h3>
        <p>Admin Panel</p>
      </div>
    </div>
    <nav class="sb-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> <span>Dashboard</span></a>
      <a href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span> <span class="sb-badge" id="unreadBadge" style="display:none;">0</span></a>
      <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> <span>Analytics</span></a>
      <a href="projects.html"><i class="fa-solid fa-folder-open"></i> <span>Projects</span></a>
      <a href="testimonials.html" class="active"><i class="fa-solid fa-star"></i> <span>Testimonials</span></a>
      <a href="skills.html"><i class="fa-solid fa-code"></i> <span>Skills</span></a>
      <a href="whatsnew.html"><i class="fa-solid fa-bullhorn"></i> <span>What's New</span></a>
      <a href="website-editor.html"><i class="fa-solid fa-pen-to-square"></i> <span>Website Editor</span></a>
      <a href="sections.html"><i class="fa-solid fa-eye"></i> <span>Sections</span></a>
      <a href="settings.html"><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
    </nav>
    <div class="sb-footer">
      <button class="sb-logout" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="sb-toggle" id="sbToggle"><i class="fa-solid fa-bars"></i></button>
      <h1>Testimonials</h1>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme (T)">
          <i class="fa-solid fa-moon moon-icon"></i>
          <i class="fa-solid fa-sun sun-icon"></i>
        </button>
        <button class="btn-refresh" id="refreshBtn"><i class="fa-solid fa-arrows-rotate"></i></button>
        <button class="btn-view-site" id="addNewBtn">
          <i class="fa-solid fa-plus"></i> <span>Add Testimonial</span>
        </button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card stat-yellow">
        <div class="stat-icon"><i class="fa-solid fa-star"></i></div>
        <div class="stat-content">
          <span class="stat-label">Total Reviews</span>
          <span class="stat-value" id="totalCount">0</span>
          <span class="stat-trend"><i class="fa-solid fa-message"></i><span>Client feedback</span></span>
        </div>
      </div>
      <div class="stat-card stat-green">
        <div class="stat-icon"><i class="fa-solid fa-trophy"></i></div>
        <div class="stat-content">
          <span class="stat-label">Featured</span>
          <span class="stat-value" id="featuredCount">0</span>
          <span class="stat-trend"><i class="fa-solid fa-fire"></i><span>Highlighted</span></span>
        </div>
      </div>
      <div class="stat-card stat-blue">
        <div class="stat-icon"><i class="fa-solid fa-star-half-stroke"></i></div>
        <div class="stat-content">
          <span class="stat-label">Avg Rating</span>
          <span class="stat-value" id="avgRating">0</span>
          <span class="stat-trend"><i class="fa-solid fa-chart-simple"></i><span>Out of 5</span></span>
        </div>
      </div>
    </div>

    <div class="filter-bar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search testimonials..." />
      </div>
      <div class="filter-buttons">
        <button class="fb active" data-filter="all">All</button>
        <button class="fb" data-filter="featured">Featured</button>
        <button class="fb" data-filter="5">5 Stars</button>
        <button class="fb" data-filter="4">4+ Stars</button>
      </div>
    </div>

    <div class="testimonials-grid" id="testimonialsGrid">
      <div class="loading-state">
        <div class="loader-spinner"></div>
        <p>Loading testimonials...</p>
      </div>
    </div>
  </main>

  <div class="modal" id="testimonialModal">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card project-modal-card">
      <button class="modal-close" data-close><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-body">
        <h2 class="modal-title" id="modalTitle">Add New Testimonial</h2>
        <form id="testimonialForm" class="project-form">
          <input type="hidden" id="testimonialId" />
          <div class="form-row-2">
            <div class="form-field">
              <i class="fa-solid fa-user field-icon"></i>
              <input type="text" id="testiName" placeholder=" " required maxlength="100" />
              <label for="testiName">Client Name *</label>
            </div>
            <div class="form-field">
              <i class="fa-solid fa-briefcase field-icon"></i>
              <input type="text" id="testiRole" placeholder=" " maxlength="100" />
              <label for="testiRole">Role / Title</label>
            </div>
          </div>
          <div class="form-row-2">
            <div class="form-field">
              <i class="fa-solid fa-building field-icon"></i>
              <input type="text" id="testiCompany" placeholder=" " maxlength="100" />
              <label for="testiCompany">Company</label>
            </div>
            <div class="form-field">
              <i class="fa-solid fa-image field-icon"></i>
              <input type="url" id="testiAvatar" placeholder=" " />
              <label for="testiAvatar">Avatar URL (optional)</label>
            </div>
          </div>
          <div class="form-field full">
            <i class="fa-solid fa-quote-left field-icon" style="top: 2rem;"></i>
            <textarea id="testiMessage" placeholder=" " rows="4" required maxlength="500"></textarea>
            <label for="testiMessage">Testimonial Message *</label>
          </div>
          <div style="margin: 1rem 0;">
            <label style="display: block; font-size: 1.2rem; color: var(--text-muted); font-weight: 600; margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;">Rating</label>
            <div class="star-rating" id="starRating">
              <i class="fa-solid fa-star star" data-rating="1"></i>
              <i class="fa-solid fa-star star" data-rating="2"></i>
              <i class="fa-solid fa-star star" data-rating="3"></i>
              <i class="fa-solid fa-star star" data-rating="4"></i>
              <i class="fa-solid fa-star star" data-rating="5"></i>
            </div>
            <input type="hidden" id="testiRating" value="5" />
          </div>
          <div class="featured-toggle" id="featuredToggle">
            <div class="featured-toggle-label">
              <i class="fa-solid fa-trophy"></i>
              <span>Featured Testimonial</span>
            </div>
            <div class="toggle-switch"></div>
            <input type="hidden" id="testiFeatured" value="no" />
          </div>
          <div class="form-error" id="formError"></div>
          <div class="form-actions">
            <button type="button" class="btn-cancel" data-close>Cancel</button>
            <button type="submit" class="btn-save" id="saveBtn">
              <i class="fa-solid fa-check"></i> <span>Save Testimonial</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/features.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/testimonials.js"></script>
</body>
</html>
