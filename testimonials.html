<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testimonials — Hanan Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/features.css" />
  <link rel="stylesheet" href="css/testimonials.css" />
  <link rel="stylesheet" href="css/upgrade-patch.css" />
  <link rel="stylesheet" href="css/mobile-responsive.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-avatar"><span>AH</span></div>
      <div><h3 id="sbUserName">Hanan</h3><p>Admin Panel</p></div>
    </div>
    <nav class="sb-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> <span>Dashboard</span></a>
      <a href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span> <span class="sb-badge" id="unreadBadge" style="display:none;">0</span></a>
      <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> <span>Analytics</span></a>
      <a href="projects.html"><i class="fa-solid fa-folder-open"></i> <span>Projects</span></a>
      <a href="testimonials.html" class="active"><i class="fa-solid fa-star"></i> <span>Testimonials</span></a>
      <a href="skills.html"><i class="fa-solid fa-code"></i> <span>Skills</span></a>
      <a href="services.html"><i class="fa-solid fa-briefcase"></i> <span>Services</span></a>
      <a href="achievements.html"><i class="fa-solid fa-trophy"></i> <span>Achievements</span></a>
      <a href="whatsnew.html"><i class="fa-solid fa-bullhorn"></i> <span>What's New</span></a>
      <a href="website-editor.html"><i class="fa-solid fa-pen-to-square"></i> <span>Website Editor</span></a>
      <a href="sections.html"><i class="fa-solid fa-eye"></i> <span>Sections</span></a>
      <a href="settings.html"><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
    </nav>
    <div class="sb-footer">
      <button class="sb-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="sb-toggle" id="sbToggle"><i class="fa-solid fa-bars"></i></button>
      <h1>Testimonials</h1>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle"><i class="fa-solid fa-moon moon-icon"></i><i class="fa-solid fa-sun sun-icon"></i></button>
        <button class="btn-refresh" id="refreshBtn"><i class="fa-solid fa-arrows-rotate"></i></button>
        <button class="btn-view-site" id="addBtn"><i class="fa-solid fa-plus"></i> <span>Add Review</span></button>
      </div>
    </header>

    <div class="testimonials-grid" id="testimonialsGrid">
      <div class="loading-state"><div class="loader-spinner"></div><p>Loading testimonials...</p></div>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-header"><h2 id="modalTitle">Add Testimonial</h2><button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button></div>
      <form id="testimonialForm" class="modal-form">
        <input type="hidden" id="testId" />
        <div class="form-field"><label>Client Name *</label><input type="text" id="name" required maxlength="200" /></div>
        <div class="form-row">
          <div class="form-field"><label>Role</label><input type="text" id="role" maxlength="100" /></div>
          <div class="form-field"><label>Company</label><input type="text" id="company" maxlength="100" /></div>
        </div>
        <div class="form-field"><label>Review Message *</label><textarea id="message" required maxlength="2000" rows="4"></textarea></div>
        <div class="form-row">
          <div class="form-field"><label>Rating</label><select id="rating"><option value="5">⭐⭐⭐⭐⭐ 5 Stars</option><option value="4">⭐⭐⭐⭐ 4 Stars</option><option value="3">⭐⭐⭐ 3 Stars</option><option value="2">⭐⭐ 2 Stars</option><option value="1">⭐ 1 Star</option></select></div>
          <div class="form-field"><label>Avatar URL (optional)</label><input type="url" id="avatar" /></div>
        </div>
        <div class="form-field" style="flex-direction: row; align-items: center; gap: 0.8rem;"><input type="checkbox" id="featured" style="width: auto;" /><label for="featured" style="margin: 0;">Featured (highlighted on website)</label></div>
        <div class="form-actions"><button type="button" class="btn-cancel" id="cancelBtn">Cancel</button><button type="submit" class="btn-save"><i class="fa-solid fa-check"></i> <span id="saveBtnText">Save Testimonial</span></button></div>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/features.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/testimonials.js"></script>
</body>
</html>
