<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — Hanan Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/features.css" />
  <link rel="stylesheet" href="css/upgrade-patch.css" />
  <link rel="stylesheet" href="css/mobile-responsive.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="bg-grid" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-avatar"><span>AH</span></div>
      <div>
        <h3 id="sbUserName">Hanan</h3>
        <p>Admin Panel</p>
      </div>
    </div>
    <nav class="sb-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> <span>Dashboard</span></a>
      <a href="messages.html" class="active"><i class="fa-solid fa-envelope"></i> <span>Messages</span> <span class="sb-badge" id="unreadBadge" style="display:none;">0</span></a>
      <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> <span>Analytics</span></a>
      <a href="projects.html"><i class="fa-solid fa-folder-open"></i> <span>Projects</span></a>
      <a href="testimonials.html"><i class="fa-solid fa-star"></i> <span>Testimonials</span></a>
      <a href="skills.html"><i class="fa-solid fa-code"></i> <span>Skills</span></a>
      <a href="whatsnew.html"><i class="fa-solid fa-bullhorn"></i> <span>What's New</span></a>
      <a href="website-editor.html"><i class="fa-solid fa-pen-to-square"></i> <span>Website Editor</span></a>
      <a href="sections.html"><i class="fa-solid fa-eye"></i> <span>Sections</span></a>
      <a href="settings.html"><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
    </nav>
    <div class="sb-footer">
      <button class="sb-logout" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="sb-toggle" id="sbToggle"><i class="fa-solid fa-bars"></i></button>
      <h1>Messages</h1>
      <div class="topbar-actions">
        <button class="btn-refresh" id="cmdPaletteBtn" title="Search (Ctrl+K)" style="margin-right: 0.4rem;">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme (T)">
          <i class="fa-solid fa-moon moon-icon"></i>
          <i class="fa-solid fa-sun sun-icon"></i>
        </button>
        <button class="btn-refresh" id="refreshBtn"><i class="fa-solid fa-arrows-rotate"></i></button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card stat-blue">
        <div class="stat-icon"><i class="fa-solid fa-envelope"></i></div>
        <div class="stat-content">
          <span class="stat-label">Total Messages</span>
          <span class="stat-value" id="totalCount">0</span>
          <span class="stat-trend"><i class="fa-solid fa-database"></i><span>All time</span></span>
        </div>
      </div>
      <div class="stat-card stat-red">
        <div class="stat-icon"><i class="fa-solid fa-circle-exclamation"></i></div>
        <div class="stat-content">
          <span class="stat-label">Unread</span>
          <span class="stat-value" id="unreadCount">0</span>
          <span class="stat-trend"><i class="fa-solid fa-bell"></i><span>Need reply</span></span>
        </div>
      </div>
      <div class="stat-card stat-green">
        <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
        <div class="stat-content">
          <span class="stat-label">Read</span>
          <span class="stat-value" id="readCount">0</span>
          <span class="stat-trend"><i class="fa-solid fa-check"></i><span>Handled</span></span>
        </div>
      </div>
    </div>

    <div class="filter-bar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search messages..." />
      </div>
      <div class="filter-buttons">
        <button class="fb active" data-filter="all">All</button>
        <button class="fb" data-filter="unread">Unread</button>
        <button class="fb" data-filter="read">Read</button>
      </div>
    </div>

    <div class="messages-container" id="messagesContainer">
      <div class="loading-state">
        <div class="loader-spinner"></div>
        <p>Loading messages...</p>
      </div>
    </div>
  </main>

  <!-- Detail Modal -->
  <div class="modal" id="messageModal">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/features.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
