<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — Hanan Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/features.css" />
</head>
<body>

  <!-- Background -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-avatar"><span>AH</span></div>
      <div>
        <h3>Hanan</h3>
        <p>Admin</p>
      </div>
    </div>

    <nav class="sb-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> <span>Dashboard</span></a>
      <a href="messages.html" class="active"><i class="fa-solid fa-envelope"></i> <span>Messages</span> <span class="sb-badge" id="unreadBadge">0</span></a>
      <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> <span>Analytics</span></a>
      <a href="projects.html"><i class="fa-solid fa-folder-open"></i> <span>Projects</span></a>
      <a href="testimonials.html"><i class="fa-solid fa-star"></i> <span>Testimonials</span></a>
      <a href="settings.html"><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
    </nav>

    <div class="sb-footer">
      <button class="sb-logout" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <!-- Top Bar -->
    <header class="topbar">
      <button class="sb-toggle" id="sbToggle"><i class="fa-solid fa-bars"></i></button>
      <h1>Messages</h1>
      <div class="topbar-actions">
        <button class="btn-refresh" id="cmdPaletteBtn" title="Search (Ctrl+K)" style="margin-right: 0.4rem;">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme (T)" aria-label="Toggle theme">
          <i class="fa-solid fa-moon moon-icon"></i>
          <i class="fa-solid fa-sun sun-icon"></i>
        </button>
        <button class="btn-refresh" id="refreshBtn" title="Refresh messages">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
        <a href="https://hanan-develop.github.io/hanan-portfolio/" target="_blank" class="btn-view-site">
          <i class="fa-solid fa-globe"></i> <span>View Site</span>
        </a>
      </div>
    </header>

    <!-- Stats Strip -->
    <div class="stats-strip">
      <div class="stat-pill">
        <i class="fa-solid fa-envelope"></i>
        <div>
          <span class="stat-num" id="totalCount">0</span>
          <span class="stat-label">Total Messages</span>
        </div>
      </div>
      <div class="stat-pill">
        <i class="fa-solid fa-envelope-open"></i>
        <div>
          <span class="stat-num" id="readCount">0</span>
          <span class="stat-label">Read</span>
        </div>
      </div>
      <div class="stat-pill highlight">
        <i class="fa-solid fa-circle-exclamation"></i>
        <div>
          <span class="stat-num" id="unreadCount">0</span>
          <span class="stat-label">Unread</span>
        </div>
      </div>
      <div class="stat-pill">
        <i class="fa-solid fa-calendar-day"></i>
        <div>
          <span class="stat-num" id="todayCount">0</span>
          <span class="stat-label">Today</span>
        </div>
      </div>
    </div>

    <!-- Filters Bar -->
    <div class="filter-bar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search by name, email, or message..." />
      </div>
      <div class="filter-buttons">
        <button class="fb active" data-filter="all">All</button>
        <button class="fb" data-filter="unread">Unread</button>
        <button class="fb" data-filter="read">Read</button>
      </div>
    </div>

    <!-- Messages Container -->
    <div class="messages-container" id="messagesContainer">
      <!-- Loading state -->
      <div class="loading-state" id="loadingState">
        <div class="loader-spinner"></div>
        <p>Loading messages from Google Sheets...</p>
      </div>
    </div>

  </main>

  <!-- Message Detail Modal -->
  <div class="modal" id="messageModal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/features.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
