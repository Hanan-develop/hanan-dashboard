<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skills — Hanan Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/features.css" />
  <link rel="stylesheet" href="css/projects.css" />
  <link rel="stylesheet" href="css/upgrade-patch.css" />
  <link rel="stylesheet" href="css/mobile-responsive.css" />
  <link rel="stylesheet" href="css/website-editor.css" />
  <link rel="stylesheet" href="css/skills.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
  </div>
  <div class="bg-grid" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-avatar"><span>AH</span></div>
      <div><h3 id="sbUserName">Hanan</h3><p>Admin Panel</p></div>
    </div>
    <nav class="sb-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> <span>Dashboard</span></a>
      <a href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span></a>
      <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> <span>Analytics</span></a>
      <a href="projects.html"><i class="fa-solid fa-folder-open"></i> <span>Projects</span></a>
      <a href="testimonials.html"><i class="fa-solid fa-star"></i> <span>Testimonials</span></a>
      <a href="skills.html" class="active"><i class="fa-solid fa-code"></i> <span>Skills</span></a>
      <a href="whatsnew.html"><i class="fa-solid fa-bullhorn"></i> <span>What's New</span></a>
      <a href="website-editor.html"><i class="fa-solid fa-pen-to-square"></i> <span>Website Editor</span></a>
      <a href="sections.html"><i class="fa-solid fa-eye"></i> <span>Sections</span></a>
      <a href="settings.html"><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
    </nav>
    <div class="sb-footer">
      <button class="sb-logout" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="sb-toggle" id="sbToggle"><i class="fa-solid fa-bars"></i></button>
      <h1>Skills</h1>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme (T)">
          <i class="fa-solid fa-moon moon-icon"></i>
          <i class="fa-solid fa-sun sun-icon"></i>
        </button>
        <button class="btn-refresh" id="refreshBtn"><i class="fa-solid fa-arrows-rotate"></i></button>
        <button class="btn-view-site" id="addNewBtn">
          <i class="fa-solid fa-plus"></i> <span>Add Skill</span>
        </button>
      </div>
    </header>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card stat-blue">
        <div class="stat-icon"><i class="fa-solid fa-code"></i></div>
        <div class="stat-content">
          <span class="stat-label">Total Skills</span>
          <span class="stat-value" id="totalCount">0</span>
          <span class="stat-trend"><i class="fa-solid fa-layer-group"></i><span>Across categories</span></span>
        </div>
      </div>
      <div class="stat-card stat-yellow">
        <div class="stat-icon"><i class="fa-solid fa-trophy"></i></div>
        <div class="stat-content">
          <span class="stat-label">Expert Level</span>
          <span class="stat-value" id="expertCount">0</span>
          <span class="stat-trend"><i class="fa-solid fa-fire"></i><span>Mastered</span></span>
        </div>
      </div>
      <div class="stat-card stat-green">
        <div class="stat-icon"><i class="fa-solid fa-tag"></i></div>
        <div class="stat-content">
          <span class="stat-label">Categories</span>
          <span class="stat-value" id="categoryCount">0</span>
          <span class="stat-trend"><i class="fa-solid fa-grid-2"></i><span>Skill groups</span></span>
        </div>
      </div>
    </div>

    <!-- Filter -->
    <div class="filter-bar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search skills..." />
      </div>
      <div class="filter-buttons" id="categoryFilters">
        <button class="fb active" data-filter="all">All</button>
      </div>
    </div>

    <!-- Skills Grid -->
    <div class="skills-grid" id="skillsGrid">
      <div class="loading-state">
        <div class="loader-spinner"></div>
        <p>Loading skills...</p>
      </div>
    </div>
  </main>

  <!-- Add/Edit Skill Modal -->
  <div class="modal" id="skillModal">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card project-modal-card">
      <button class="modal-close" data-close><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-body">
        <h2 class="modal-title" id="modalTitle">Add New Skill</h2>

        <form id="skillForm" class="project-form">
          <input type="hidden" id="skillId" />

          <div class="form-row-2">
            <div class="form-field">
              <i class="fa-solid fa-code field-icon"></i>
              <input type="text" id="skillName" placeholder=" " required maxlength="80" />
              <label for="skillName">Skill Name *</label>
            </div>

            <div class="form-field">
              <i class="fa-solid fa-tag field-icon"></i>
              <input type="text" id="skillCategory" placeholder=" " required maxlength="50" list="skillCategories" />
              <label for="skillCategory">Category *</label>
              <datalist id="skillCategories">
                <option value="Frontend">
                <option value="Backend">
                <option value="CMS">
                <option value="Design">
                <option value="Tools">
                <option value="Other">
              </datalist>
            </div>
          </div>

          <div class="form-row-2">
            <div class="form-field">
              <i class="fa-solid fa-icons field-icon"></i>
              <input type="text" id="skillIcon" placeholder=" " maxlength="50" value="fa-code" />
              <label for="skillIcon">FontAwesome Icon (e.g., fa-html5)</label>
            </div>

            <div class="form-field color-field">
              <i class="fa-solid fa-palette field-icon"></i>
              <input type="text" id="skillColor" placeholder=" " value="#f9ca24" maxlength="7" />
              <label for="skillColor">Brand Color (hex)</label>
              <input type="color" id="skillColorPicker" value="#f9ca24" class="color-picker-input" />
            </div>
          </div>

          <!-- Level Selector -->
          <div>
            <label style="display: block; font-size: 1.2rem; color: var(--text-muted); font-weight: 600; margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;">Proficiency Level</label>
            <div class="level-options">
              <label class="level-option">
                <input type="radio" name="level" value="Beginner" />
                <div class="level-card">
                  <i class="fa-solid fa-seedling"></i>
                  <span>Beginner</span>
                  <small>0-30%</small>
                </div>
              </label>
              <label class="level-option">
                <input type="radio" name="level" value="Intermediate" />
                <div class="level-card">
                  <i class="fa-solid fa-graduation-cap"></i>
                  <span>Intermediate</span>
                  <small>30-70%</small>
                </div>
              </label>
              <label class="level-option">
                <input type="radio" name="level" value="Advanced" />
                <div class="level-card">
                  <i class="fa-solid fa-rocket"></i>
                  <span>Advanced</span>
                  <small>70-90%</small>
                </div>
              </label>
              <label class="level-option">
                <input type="radio" name="level" value="Expert" />
                <div class="level-card">
                  <i class="fa-solid fa-crown"></i>
                  <span>Expert</span>
                  <small>90-100%</small>
                </div>
              </label>
            </div>
          </div>

          <!-- Percentage Slider -->
          <div>
            <label style="display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; color: var(--text-muted); font-weight: 600; margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;">
              <span>Percentage</span>
              <span style="color: var(--yellow); font-size: 1.6rem; font-weight: 800;"><span id="percentDisplay">75</span>%</span>
            </label>
            <input type="range" id="skillPercent" min="0" max="100" value="75" class="percent-slider" />
          </div>

          <div class="form-error" id="formError"></div>

          <div class="form-actions">
            <button type="button" class="btn-cancel" data-close>Cancel</button>
            <button type="submit" class="btn-save" id="saveBtn">
              <i class="fa-solid fa-check"></i> <span>Save Skill</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/features.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/skills.js"></script>
</body>
</html>
