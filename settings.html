<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Hanan Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/features.css" />
  <link rel="stylesheet" href="css/upgrade-patch.css" />
  <link rel="stylesheet" href="css/mobile-responsive.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="bg-grid" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-avatar"><span>AH</span></div>
      <div>
        <h3 id="sbUserName">Hanan</h3>
        <p>Admin Panel</p>
      </div>
    </div>
    <nav class="sb-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> <span>Dashboard</span></a>
      <a href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span> <span class="sb-badge" id="unreadBadge" style="display:none;">0</span></a>
      <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> <span>Analytics</span></a>
      <a href="projects.html"><i class="fa-solid fa-folder-open"></i> <span>Projects</span></a>
      <a href="testimonials.html"><i class="fa-solid fa-star"></i> <span>Testimonials</span></a>
      <a href="skills.html"><i class="fa-solid fa-code"></i> <span>Skills</span></a>
      <a href="whatsnew.html"><i class="fa-solid fa-bullhorn"></i> <span>What's New</span></a>
      <a href="website-editor.html"><i class="fa-solid fa-pen-to-square"></i> <span>Website Editor</span></a>
      <a href="sections.html"><i class="fa-solid fa-eye"></i> <span>Sections</span></a>
      <a href="settings.html" class="active"><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
    </nav>
    <div class="sb-footer">
      <button class="sb-logout" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="sb-toggle" id="sbToggle"><i class="fa-solid fa-bars"></i></button>
      <h1>Settings</h1>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme (T)">
          <i class="fa-solid fa-moon moon-icon"></i>
          <i class="fa-solid fa-sun sun-icon"></i>
        </button>
      </div>
    </header>

    <div class="settings-card">
      <h2><i class="fa-solid fa-user-gear"></i> Account Information</h2>
      <p class="settings-subtitle">Your current login credentials</p>
      <div class="current-info" id="currentInfo">
        <div class="current-info-row"><span class="label">Username</span><span class="value" id="currentUsername">—</span></div>
        <div class="current-info-row"><span class="label">Last Updated</span><span class="value" id="lastUpdated">—</span></div>
        <div class="current-info-row"><span class="label">Status</span><span class="value" style="color: var(--success);"><i class="fa-solid fa-circle-check"></i> Active</span></div>
      </div>
    </div>

    <div class="settings-card">
      <h2><i class="fa-solid fa-key"></i> Change Password</h2>
      <p class="settings-subtitle">Update your dashboard login credentials</p>
      <form id="changeCredsForm" class="settings-form">
        <div class="form-field">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" id="currentPassword" placeholder=" " required />
          <label for="currentPassword">Current Password *</label>
          <button type="button" class="toggle-pwd" data-target="currentPassword"><i class="fa-solid fa-eye"></i></button>
        </div>
        <div class="form-field">
          <i class="fa-solid fa-user field-icon"></i>
          <input type="text" id="newUsername" placeholder=" " />
          <label for="newUsername">New Username (optional)</label>
        </div>
        <div class="form-field">
          <i class="fa-solid fa-lock-open field-icon"></i>
          <input type="password" id="newPassword" placeholder=" " required minlength="6" />
          <label for="newPassword">New Password *</label>
          <button type="button" class="toggle-pwd" data-target="newPassword"><i class="fa-solid fa-eye"></i></button>
        </div>
        <div class="password-strength" id="strengthIndicator" style="display:none;">
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <span class="strength-text" id="strengthText">—</span>
        </div>
        <div class="form-field">
          <i class="fa-solid fa-shield field-icon"></i>
          <input type="password" id="confirmPassword" placeholder=" " required />
          <label for="confirmPassword">Confirm New Password *</label>
        </div>
        <div class="form-error" id="formError"></div>
        <div class="form-success" id="formSuccess" style="display: none;"></div>
        <div class="form-actions">
          <button type="submit" class="btn-save">
            <i class="fa-solid fa-check"></i> <span>Update Credentials</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/features.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
