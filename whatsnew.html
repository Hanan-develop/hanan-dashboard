<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's New — Hanan Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="bg-grid"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-avatar"><span>AH</span></div>
      <div><h3 id="sbUserName">Hanan</h3><p>Admin Panel</p></div>
    </div>
    <nav class="sb-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> <span>Dashboard</span></a>
      <a href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span> <span class="sb-badge" id="unreadBadge" style="display:none;">0</span></a>
      <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> <span>Analytics</span></a>
      <a href="projects.html"><i class="fa-solid fa-folder-open"></i> <span>Projects</span></a>
      <a href="testimonials.html"><i class="fa-solid fa-star"></i> <span>Testimonials</span></a>
      <a href="skills.html"><i class="fa-solid fa-code"></i> <span>Skills</span></a>
      <a href="services.html"><i class="fa-solid fa-briefcase"></i> <span>Services</span></a>
      <a href="achievements.html"><i class="fa-solid fa-trophy"></i> <span>Achievements</span></a>
      <a href="whatsnew.html" class="active"><i class="fa-solid fa-bullhorn"></i> <span>What's New</span></a>
      <a href="website-editor.html"><i class="fa-solid fa-pen-to-square"></i> <span>Website Editor</span></a>
      <a href="sections.html"><i class="fa-solid fa-eye"></i> <span>Sections</span></a>
      <a href="settings.html"><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
    </nav>
    <div class="sb-footer">
      <button class="sb-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="sb-toggle" id="sbToggle"><i class="fa-solid fa-bars"></i></button>
      <h1>What's New</h1>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle"><i class="fa-solid fa-moon moon-icon"></i><i class="fa-solid fa-sun sun-icon"></i></button>
        <button class="btn-export" id="exportBtn" title="Export as JSON"><i class="fa-solid fa-download"></i> <span>Export</span></button>
        <button class="btn-refresh" id="refreshBtn"><i class="fa-solid fa-arrows-rotate"></i></button>
        <button class="btn-add" id="addBtn"><i class="fa-solid fa-plus"></i> <span>Add Update</span></button>
      </div>
    </header>

    <div class="filter-toolbar">
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="NEW">New</button>
        <button class="filter-btn" data-filter="LAUNCH">Launch</button>
        <button class="filter-btn" data-filter="UPDATE">Update</button>
      </div>
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="searchInput" placeholder="Search updates..." />
      </div>
      <span class="search-result-count" id="searchResultCount" style="display:none;"></span>
    </div>

    <div class="timeline" id="grid"><div class="loading-state"><div class="loader-spinner"></div><p>Loading updates...</p></div></div>
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-header"><h2 id="modalTitle">Add Update</h2><button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button></div>
      <form id="itemForm">
        <input type="hidden" id="itemId" />
        <div class="form-field"><label>Title *</label><input type="text" id="title" required maxlength="100" /></div>
        <div class="form-row">
          <div class="form-field"><label>Tag</label><select id="tag"><option>NEW</option><option>LAUNCH</option><option>UPDATE</option><option>MILESTONE</option><option>LEARNING</option></select></div>
          <div class="form-field"><label>Date</label><input type="date" id="date" required /></div>
        </div>
        <div class="form-field"><label>Description *</label><textarea id="description" required maxlength="500"></textarea></div>
        <div class="form-field"><label>Link (optional)</label><input type="url" id="link" /></div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-save"><i class="fa-solid fa-check"></i> <span id="saveBtnText">Save</span></button>
        </div>
      </form>
    </div>
  </div>
  </main>

  <div class="notify-container" id="notifyContainer"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/whatsnew.js"></script>
</body>
</html>
