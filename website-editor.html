<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Editor — Hanan Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/features.css" />
  <link rel="stylesheet" href="css/website-editor.css" />
  <link rel="stylesheet" href="css/upgrade-patch.css" />
  <link rel="stylesheet" href="css/mobile-responsive.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-avatar"><span>AH</span></div>
      <div><h3 id="sbUserName">Hanan</h3><p>Admin Panel</p></div>
    </div>
    <nav class="sb-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> <span>Dashboard</span></a>
      <a href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span> <span class="sb-badge" id="unreadBadge" style="display:none;">0</span></a>
      <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> <span>Analytics</span></a>
      <a href="projects.html"><i class="fa-solid fa-folder-open"></i> <span>Projects</span></a>
      <a href="testimonials.html"><i class="fa-solid fa-star"></i> <span>Testimonials</span></a>
      <a href="skills.html"><i class="fa-solid fa-code"></i> <span>Skills</span></a>
      <a href="services.html"><i class="fa-solid fa-briefcase"></i> <span>Services</span></a>
      <a href="achievements.html"><i class="fa-solid fa-trophy"></i> <span>Achievements</span></a>
      <a href="whatsnew.html"><i class="fa-solid fa-bullhorn"></i> <span>What's New</span></a>
      <a href="website-editor.html" class="active"><i class="fa-solid fa-pen-to-square"></i> <span>Website Editor</span></a>
      <a href="sections.html"><i class="fa-solid fa-eye"></i> <span>Sections</span></a>
      <a href="settings.html"><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
    </nav>
    <div class="sb-footer">
      <button class="sb-logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="sb-toggle" id="sbToggle"><i class="fa-solid fa-bars"></i></button>
      <h1>Website Editor</h1>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle"><i class="fa-solid fa-moon moon-icon"></i><i class="fa-solid fa-sun sun-icon"></i></button>
        <button class="btn-refresh" id="refreshBtn"><i class="fa-solid fa-arrows-rotate"></i></button>
      </div>
    </header>

    <div class="editor-tabs">
      <button class="editor-tab active" data-tab="hero"><i class="fa-solid fa-house"></i> Hero</button>
      <button class="editor-tab" data-tab="about"><i class="fa-solid fa-user"></i> About</button>
      <button class="editor-tab" data-tab="contact"><i class="fa-solid fa-envelope"></i> Contact</button>
      <button class="editor-tab" data-tab="social"><i class="fa-solid fa-share-nodes"></i> Social</button>
    </div>

    <form id="editorForm" class="editor-form">
      <!-- HERO TAB -->
      <div class="editor-panel active" data-panel="hero">
        <h2 class="panel-title"><i class="fa-solid fa-house"></i> Hero Section</h2>
        <div class="form-field"><label>Name *</label><input type="text" id="hero_name" maxlength="100" required placeholder="Abdul Hanan" /></div>
        <div class="form-field"><label>Tagline *</label><input type="text" id="hero_tagline" maxlength="200" required placeholder="WordPress Developer & Shopify Designer" /></div>
        <div class="form-field"><label>Subtitle</label><textarea id="hero_subtitle" maxlength="500" rows="3"></textarea></div>
        <div class="form-row">
          <div class="form-field"><label>CTA Button Text</label><input type="text" id="hero_cta_text" maxlength="50" value="Hire Me" /></div>
          <div class="form-field"><label>CTA Link</label><input type="text" id="hero_cta_link" maxlength="200" value="#contact" /></div>
        </div>
        <div class="form-field"><label>Avatar URL (optional)</label><input type="url" id="hero_avatar" /></div>
      </div>

      <!-- ABOUT TAB -->
      <div class="editor-panel" data-panel="about">
        <h2 class="panel-title"><i class="fa-solid fa-user"></i> About Section</h2>
        <div class="form-field"><label>Section Title</label><input type="text" id="about_title" maxlength="100" value="About Me" /></div>
        <div class="form-field"><label>Description</label><textarea id="about_description" maxlength="1000" rows="5"></textarea></div>
        <div class="stats-row">
          <div class="form-field"><label>Years Experience</label><input type="text" id="about_years" maxlength="10" value="2" /></div>
          <div class="form-field"><label>Projects</label><input type="text" id="about_projects" maxlength="10" value="6" /></div>
          <div class="form-field"><label>Clients</label><input type="text" id="about_clients" maxlength="10" value="5" /></div>
          <div class="form-field"><label>Satisfaction %</label><input type="text" id="about_satisfaction" maxlength="10" value="100" /></div>
        </div>
      </div>

      <!-- CONTACT TAB -->
      <div class="editor-panel" data-panel="contact">
        <h2 class="panel-title"><i class="fa-solid fa-envelope"></i> Contact Section</h2>
        <div class="form-field"><label>Email *</label><input type="email" id="contact_email" required /></div>
        <div class="form-row">
          <div class="form-field"><label>Phone</label><input type="text" id="contact_phone" maxlength="20" /></div>
          <div class="form-field"><label>WhatsApp (numbers only)</label><input type="text" id="contact_whatsapp" maxlength="15" placeholder="923254145534" /></div>
        </div>
        <div class="form-field"><label>Location</label><input type="text" id="contact_location" maxlength="100" /></div>
        <div class="form-field"><label>Availability Status</label>
          <div class="availability-options">
            <label class="availability-option"><input type="radio" name="availability" value="available" checked /><span class="ao-card available"><span class="ao-dot"></span><span class="ao-label">Available for Work</span></span></label>
            <label class="availability-option"><input type="radio" name="availability" value="busy" /><span class="ao-card busy"><span class="ao-dot"></span><span class="ao-label">Currently Busy</span></span></label>
            <label class="availability-option"><input type="radio" name="availability" value="unavailable" /><span class="ao-card unavailable"><span class="ao-dot"></span><span class="ao-label">Not Available</span></span></label>
          </div>
        </div>
      </div>

      <!-- SOCIAL TAB -->
      <div class="editor-panel" data-panel="social">
        <h2 class="panel-title"><i class="fa-solid fa-share-nodes"></i> Social Links</h2>
        <div class="form-field"><label><i class="fa-brands fa-github"></i> GitHub</label><input type="url" id="social_github" /></div>
        <div class="form-field"><label><i class="fa-brands fa-linkedin"></i> LinkedIn</label><input type="url" id="social_linkedin" /></div>
        <div class="form-field"><label><i class="fa-brands fa-youtube"></i> YouTube</label><input type="url" id="social_youtube" /></div>
        <div class="form-field"><label><i class="fa-brands fa-twitter"></i> Twitter / X</label><input type="url" id="social_twitter" /></div>
        <div class="form-field"><label><i class="fa-brands fa-instagram"></i> Instagram</label><input type="url" id="social_instagram" /></div>
        <div class="form-field"><label><i class="fa-brands fa-facebook"></i> Facebook</label><input type="url" id="social_facebook" /></div>
      </div>

      <div class="editor-actions">
        <button type="submit" class="btn-save-editor"><i class="fa-solid fa-check"></i> <span>Save All Changes</span></button>
      </div>
    </form>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/features.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/website-editor.js"></script>
</body>
</html>
